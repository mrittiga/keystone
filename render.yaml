databases:
  - name: keystone-db
    databaseName: keystone_db
    user: keystone_app
    plan: basic-256mb

services:
  - type: web
    name: keystone-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: keystone-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: keystone-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: keystone-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: keystone-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: keystone-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CHAT_PROVIDER
        value: gemini
      - key: CHAT_PROVIDER_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
      - key: CHAT_PROVIDER_API_KEY
        sync: false

  - type: web
    name: keystone-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_URL
        sync: false
