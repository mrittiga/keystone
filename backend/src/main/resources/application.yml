spring:
  application:
    name: keystone
  datasource:
    url: jdbc:postgresql://localhost:5432/keystone_db
    username: keystoneuser
    password: keystone123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

security:
  jwt:
    secret: keystone-super-secret-key-minimum-32-chars-long
    expiry: 86400000

server:
  port: 8080

logging:
  level:
    root: INFO
    com.meridian: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
